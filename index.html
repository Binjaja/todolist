<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tâches">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tâches</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title">Agenda</h1>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
  <button id="menuBtn" type="button" aria-label="Menu">⋯</button>
</header>

<main id="panes">
  <section class="pane" id="agenda"></section>
  <section class="pane"><ul class="list" id="undated"></ul></section>
  <section class="pane" id="routine"></section>
</main>

<div id="keys" hidden>
  <button type="button" data-k="&amp;">&amp;</button>
  <button type="button" data-k="!">!</button>
  <button type="button" data-k=":">:</button>
  <button type="button" data-k="€">€</button>
  <button type="button" data-k="close" aria-label="Fermer le clavier">⌄</button>
</div>

<form id="bar" autocomplete="off">
  <button type="button" id="cancel" aria-label="Annuler la modification" hidden>×</button>
  <input id="in" type="text" enterkeyhint="done" placeholder="Nouvelle tâche…  demain &bleu !18:30 €" autocapitalize="sentences">
  <button type="submit" id="go" aria-label="Valider">↑</button>
</form>

<div id="sheet" hidden><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="js/parser.js"></script>
<script src="js/store.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
